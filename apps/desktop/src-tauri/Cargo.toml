[package]
name = "jobsniper-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
url = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
